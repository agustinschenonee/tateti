<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tateti Clásico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <h1>Tateti</h1>
        <div id="estado-juego" class="estado">Turno del jugador: X</div>
        
        <div class="tablero" id="tablero">
            <div class="celda" data-indice="0"></div>
            <div class="celda" data-indice="1"></div>
            <div class="celda" data-indice="2"></div>
            <div class="celda" data-indice="3"></div>
            <div class="celda" data-indice="4"></div>
            <div class="celda" data-indice="5"></div>
            <div class="celda" data-indice="6"></div>
            <div class="celda" data-indice="7"></div>
            <div class="celda" data-indice="8"></div>
        </div>

        <button id="btn-reiniciar">Reiniciar Juego</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
